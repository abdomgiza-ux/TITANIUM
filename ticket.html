<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Open a ticket — TiTANiUM Technology</title>
  <meta name="description" content="Open a support or project ticket with TiTANiUM Technology, Dubai." />
  <meta name="theme-color" content="#050608" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body class="ticket-body">
  <header class="nav">
    <a class="brand" href="/" aria-label="TiTANiUM Technology"><img class="brand-logo" src="/logo.png" alt="TiTANiUM Technology" width="900" height="242" /></a>
    <div class="nav-right">
      <button class="lang" id="lang" type="button" aria-label="Switch language"><span data-i18n="nav.lang">العربية</span></button>
      <a class="pill pill-sm" href="/" data-i18n="tk.back">Back to site</a>
    </div>
  </header>

  <main class="ticket-page">
    <p class="eyebrow" data-i18n="tk.eyebrow">Support ticket</p>
    <h1 class="section-title" data-i18n="tk.title">Tell us what's going on.</h1>
    <p class="lead" data-i18n="tk.sub">Describe the problem or the project. We'll reply to the email you give below, usually the same day.</p>

    <form id="ticketForm" class="form" name="ticket" method="POST" action="https://api.web3forms.com/submit" novalidate>
      <input type="hidden" name="form-name" value="ticket" />
      <input type="hidden" name="ticket_id" id="ticketId" value="" />
      <input type="hidden" name="access_key" value="858c51ff-6741-4b14-851d-f76a9b9daad1" />
      <input type="hidden" name="from_name" value="TiTANiUM Tickets" />
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" style="display:none" />
      <div class="row">
        <label class="field"><span data-i18n="f.name">Name</span><input name="name" type="text" required autocomplete="name" /></label>
        <label class="field"><span data-i18n="f.email">Email</span><input name="email" type="email" required autocomplete="email" dir="ltr" /></label>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="f.phone">Phone</span><input name="phone" type="tel" autocomplete="tel" dir="ltr" /></label>
        <label class="field"><span data-i18n="f.company">Company</span><input name="company" type="text" autocomplete="organization" /></label>
      </div>
      <label class="field"><span data-i18n="f.topic">What do you need?</span>
        <select name="topic">
          <option value="Support" data-i18n="o1">IT support</option>
          <option value="Network" data-i18n="o2">Network &amp; cabling</option>
          <option value="M365" data-i18n="o3">Microsoft 365 / Active Directory</option>
          <option value="VoIP-CCTV" data-i18n="o4">VoIP &amp; CCTV</option>
          <option value="Printers" data-i18n="o5">Printers &amp; office equipment</option>
          <option value="Web" data-i18n="o6">Website / software</option>
          <option value="Other" data-i18n="o7">Something else</option>
        </select>
      </label>
      <label class="field"><span data-i18n="f.subject">Subject</span><input name="subject" type="text" /></label>
      <label class="field"><span data-i18n="f.msg">Message</span><textarea name="message" rows="6" required></textarea></label>
      <button class="pill pill-block" type="submit"><span data-i18n="tk.send">Submit ticket</span></button>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="footer">
    <img class="foot-logo" src="/logo.png" alt="TiTANiUM Technology" width="900" height="242" loading="lazy" />
    <span data-i18n="footer.rights">© 2026 TiTANiUM Technology. All rights reserved.</span>
  </footer>
  <script type="module" src="/src/ticket.js"></script>
</body>
</html>
